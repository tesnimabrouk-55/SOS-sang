{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: sos-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sos.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.secrets.jwtSecret }}
  {{- fail "secrets.jwtSecret est obligatoire (openssl rand -hex 48)" }}
  {{- end }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  INTERNAL_API_TOKEN: {{ required "secrets.internalApiToken obligatoire" .Values.secrets.internalApiToken | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl obligatoire" .Values.secrets.databaseUrl | quote }}
  AMQP_URL: {{ required "secrets.amqpUrl obligatoire" .Values.secrets.amqpUrl | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword obligatoire" .Values.secrets.postgresPassword | quote }}
  RABBITMQ_PASSWORD: {{ required "secrets.rabbitmqPassword obligatoire" .Values.secrets.rabbitmqPassword | quote }}
{{- end }}

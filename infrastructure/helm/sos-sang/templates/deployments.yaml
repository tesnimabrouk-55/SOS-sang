{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}-service
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sos.labels" $ | nindent 4 }}
    app: {{ .name }}-service
    tier: backend
spec:
  {{- if and $.Values.autoscaling.enabled .critical }}
  replicas: 1
  {{- else }}
  replicas: {{ if eq $.Values.profile "local" }}1{{ else }}2{{ end }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: {{ .name }}-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app: {{ .name }}-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .port }}"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.registry }}/sos-sang-{{ .name }}-service:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { containerPort: {{ .port }}, name: http }
          envFrom:
            - configMapRef: { name: sos-config }
            - secretRef: { name: {{ include "sos.secretName" $ }} }
          env:
            - { name: SERVICE_NAME, value: "{{ .name }}-service" }
            - { name: {{ .name | upper }}_PORT, value: "{{ .port }}" }
            - { name: HEALTH_PORT, value: "{{ .port }}" }
            - { name: {{ .name | upper }}_DB_SCHEMA, value: "{{ .schema }}" }
          resources:
            {{- toYaml $.Values.resources.backend | nindent 12 }}
          readinessProbe:
            httpGet: { path: /ready, port: {{ .port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: {{ .port }} }
            initialDelaySeconds: 25
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sos.labels" . | nindent 4 }}
    app: gateway
spec:
  replicas: {{ if eq .Values.profile "local" }}1{{ else }}{{ .Values.gateway.replicas }}{{ end }}
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.registry }}/sos-sang-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: sos-config }
            - secretRef: { name: {{ include "sos.secretName" . }} }
          env:
            - { name: SERVICE_NAME, value: gateway }
            - { name: API_GATEWAY_PORT, value: "8080" }
            - { name: HEALTH_PORT, value: "8080" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 400m, memory: 320Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sos.labels" . | nindent 4 }}
    app: frontend
spec:
  replicas: {{ if eq .Values.profile "local" }}1{{ else }}{{ .Values.frontend.replicas }}{{ end }}
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/sos-sang-frontend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 80, name: http }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10

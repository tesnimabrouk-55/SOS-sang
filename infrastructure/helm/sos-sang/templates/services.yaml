{{- range .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-service
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sos.labels" $ | nindent 4 }}
spec:
  selector: { app: {{ .name }}-service }
  ports:
    - { name: http, port: {{ .port }}, targetPort: {{ .port }} }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: 80 }]

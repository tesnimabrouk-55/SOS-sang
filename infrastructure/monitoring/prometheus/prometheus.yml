global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: sos-sang

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8080']

  # En Kubernetes, les annotations prometheus.io/scrape sont utilisees a la place.
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'auth-service:4001'
          - 'donor-service:4002'
          - 'hospital-service:4003'
          - 'matching-service:4004'
          - 'notification-service:4005'
          - 'stock-service:4006'
          - 'dashboard-service:4007'

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [sos-app, sos-data]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: 'true'
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
        action: replace
        regex: '(\d+);(.+)'
        replacement: '$2:$1'
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

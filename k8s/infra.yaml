apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: sos-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: sos-app }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: sos-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-alpine
        ports: [{ containerPort: 5672 }]
        env:
        - { name: RABBITMQ_DEFAULT_USER, value: sos }
        - { name: RABBITMQ_DEFAULT_PASS, value: sos_local_password }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: sos-app }
spec:
  selector: { app: rabbitmq }
  ports: [{ port: 5672 }]

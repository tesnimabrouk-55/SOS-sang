apiVersion: apps/v1
kind: Deployment
metadata: { name: hospital-service, namespace: sos-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: hospital-service } }
  template:
    metadata: { labels: { app: hospital-service } }
    spec:
      containers:
      - name: hospital-service
        image: ghcr.io/tesnimabrouk-55/sos-hospital:latest
        imagePullPolivy: Always
        ports: [{ containerPort: 4003 }]
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: sos-secret, key: POSTGRES_PASSWORD } }
        - name: JWT_SECRET
          valueFrom: { secretKeyRef: { name: sos-secret, key: JWT_SECRET } }
        - name: INTERNAL_API_TOKEN
          valueFrom: { secretKeyRef: { name: sos-secret, key: INTERNAL_API_TOKEN } }
        - { name: DATABASE_URL, value: "postgresql://sos:$(POSTGRES_PASSWORD)@postgres:5432/sos_sang" }
        - { name: REDIS_URL, value: "redis://redis:6379" }
        - { name: AMQP_URL, value: "amqp://sos:sos_local_password@rabbitmq:5672" }
        - { name: HOSPITAL_DB_SCHEMA, value: hospital }
        - { name: HOSPITAL_PORT, value: "4003" }
        - { name: HEALTH_PORT, value: "4003" }
        - { name: CORS_ORIGINS, value: "http://localhost:3000,http://localhost:8080" }
        - { name: PUBLIC_BASE_URL, value: "http://localhost:3000" }
        readinessProbe: { httpGet: { path: /health, port: 4003 }, initialDelaySeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: hospital-service, namespace: sos-app }
spec:
  selector: { app: hospital-service }
  ports: [{ port: 4003 }]
